practical work inform the research question</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">02 / 09</tspan></text></svg></section><section class="slide" aria-label="Slide 3"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-2"><title id="title-2">Does the set contain the right answer?</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">WHY COVERAGE MATTERS</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">Does the set contain the right answer?</tspan></text><text fill="#c3c2b7" font-size="30" font-weight="400" text-anchor="start"><tspan x="86" y="259.3">A point prediction can miss the right answer.</tspan></text><rect x="112" y="324" width="361" height="84" rx="42.0" fill="#1a1a19" stroke="#72adf5" stroke-width="2"/><text fill="#72adf5" font-size="31" font-weight="700" text-anchor="middle"><tspan x="292.5" y="367.21">Prediction: A</tspan></text><line x1="499" y1="366" x2="639" y2="366" stroke="#c3c2b7" stroke-width="3"/><polygon points="639,366 623.767107542066,373.5471178184138 623.767107542066,358.4528821815862" fill="#c3c2b7"/><rect x="669" y="280" width="482" height="207" rx="22" fill="#1a1a19" stroke="#a69cf4" stroke-width="2"/><text fill="#a69cf4" font-size="30" font-weight="700" text-anchor="start"><tspan x="697" y="328.3">Prediction set</tspan></text><ellipse cx="760.0" cy="412.0" rx="43.0" ry="43.0" fill="#0d0d0d" stroke="#a69cf4" stroke-width="3"/><text fill="#a69cf4" font-size="30" font-weight="700" text-anchor="middle"><tspan x="760.0" y="421.3">A</tspan></text><ellipse cx="910.0" cy="412.0" rx="43.0" ry="43.0" fill="#0d0d0d" stroke="#a69cf4" stroke-width="3"/><text fill="#a69cf4" font-size="30" font-weight="700" text-anchor="middle"><tspan x="910.0" y="421.3">B</tspan></text><rect x= ke-width="2"/><text fill="#73cdb0" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1291.0" y="698.11">ICLR 2027 · under review</tspan></text><line x1="437" y1="358" x2="684" y2="358" stroke="#c3c2b7" stroke-width="3"/><polygon points="684,358 668.767107542066,365.5471178184138 668.767107542066,350.4528821815862" fill="#c3c2b7"/><line x1="924" y1="358" x2="1171" y2="358" stroke="#c3c2b7" stroke-width="3"/><polygon points="1171,358 1155.767107542066,365.5471178184138 1155.767107542066,350.4528821815862" fill="#c3c2b7"/><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">UAI 2026 published · AISTATS 2027 and ICLR 2027 submitted, decisions pending</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">04 / 09</tspan></text></svg></section><section class="slide" aria-label="Slide 5"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-4"><title id="title-4">A shift can hit what a model relies on</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">UAI 2026 · SHAP AS A PROXY FOR MODEL RELIANCE</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">A shift can hit what a model relies on</tspan></text><text fill="#c3c2b7" font-size="30" font-weight="400" text-anchor="start"><tspan x="86" y="259.3">Same disruption. Different patterns of feature attribution.</tspan></text><text fill="#f3a277" font-size="33" font-weight="700" text-anchor="start"><tspan x="86" y="330.03">Concentrated SHAP</tspan></text><text fill="#c3c2b7" font-size="28" font-weight="400" text-anchor="start"><tspan x="86" y="405.48">Feature 1</tspan></text><rect x="295" y="390" width="308" height="23" rx="4" fill="#f3a2 'use strict';const data=[{"title": "Can we tell when a model\nstops being reliable?", "note": "Thank you for the opportunity to speak with you. I am Chorok Lee, a master's student in Software Engineering at KAIST. My research asks what the information available to a model evaluator can actually establish about predictive reliability. I will briefly introduce my background, then explain how a study of conformal coverage failures led to my thesis on identification and related work on selective labels. I will finish with the direction I would like to develop during a PhD.", "seconds": 40, "backup": false}, {"title": "From economics to building and evaluating ML", "note": "My undergraduate degree is in Economics from Yonsei University's Underwood International College, and I spent an exchange year at Dartmouth. I then worked as a software engineer before starting my master's at KAIST in February 2025, supervised by Professor Insik Shin. I expect to complete the degree in February 2027. My graduate preparation includes probability and statistics, stochastic calculus, Bayesian machine learning, and deep learning.\n\nIn parallel, I have worked at SAP Labs Korea as a software engineering intern. My projects have included retrieval evaluation, agent workflows, and tools for accessing cloud telemetry. Before SAP, I built data pipelines and GraphRAG components at a legal AI startup. These experiences make implementation and measurement a natural part of my research. For a PhD, I want to develop the statistical foundations behind those measurements: when a seemingly reassuring evaluation is informative, and when it cannot answer the question we care about.", "seconds": 70, "backup": false}, {"title": "Does the set contain the right answer?", "note": "When a wrong answer is costly, a prediction set gives us a way to express uncertainty. Coverage is the probability that the true label falls inside that set. Under standard exchangeability assumptions, conformal prediction provides a marginal guarantee across test points.\n\nAfter deployment, inputs may shift and the true labels needed to check coverage may be missing or selective. We can still observe features and model scores, so a drift alarm or stable confidence histogram may look reassuring. But these measure different objects. A shift metric describes changes in inputs. Coverage also depends on how the inputs and scores relate to true outcomes. My work asks which parts of that relationship survive in the summaries we observe, and what conclusions remain justified when they do not.", "seconds": 65, "backup": false}, {"title": "Diagnose → understand limits → ask for evidence", "note": "There are three stages in this research trajectory. My published UAI 2026 paper studies a diagnostic: whether feature-importance concentration helps anticipate coverage vulnerability in gradient-boosted classifiers. My master's thesis, submitted to AISTATS 2027, asks an identification question: what can shift and confidence summaries actually tell us about coverage? My related ICLR 2027 submission asks an intervention question: how much can a limited label audit reveal about model risk when labels are selective and noisy? The latter two papers are under review. Together, they move from observing failures to understanding information limits, and then to acquiring information that can resolve them.", "seconds": 45, "backup": false}, {"title": "A shift can hit what a model relies on", "note": "The starting point was a COVID-19 supply-chain case study. Several classification tasks experienced the same temporal disruption, but their conformal coverage deteriorated very differently. Shift indicators detected the disruption without explaining that variation in failure severity.\n\nI studied SHAP concentration: how much of the measured feature attribution is assigned to the top feature. It is a proxy for model reliance. Across sixteen multiclass tasks in nine domains, greater concentration was associated with greater coverage loss in the gradient-boosted classifiers studied. I also derived an idealized score and coverage-bound result under explicit assumptions; this is not a theorem that actual coverage must always decrease.\n\nThe diagram is schematic. A shift that hits a feature with concentrated attribution can expose a vulnerability, but the diagnostic is exploratory and model dependent. It does not explain the global-sensitivity failures seen in neural networks. That raised the next question: is a diagnostic imperfect, or has the summary already discarded information needed to identify coverage?", "seconds": 90, "backup": false}, {"title": "Same distance. Different direction. Different coverage.", "note": "I first study a controlled binary classification setting with a known logistic relationship between scores and labels. This is stronger than general source calibration.\n\nImagine two Gaussian shifts with the same magnitude. One is aligned with the model-score direction; the other is orthogonal to it. Rotation-invariant shift summaries give the same value, yet coverage can differ. The point is the lost directional information, not that every aligned shift must be harmful. Estimating the same magnitude more accurately cannot restore what that summary discarded.\n\nThe positive result is specific to this known-link setting: the absolute-score distribution determines the full coverage curve. That tells us what information coverage needs here. Next, I remove the known-link assumption.", "seconds": 110, "backup": false}, {"title": "The same score can hide different chances of error", "note": "Next, the score-to-label relationship is no longer known. A score compresses many inputs into one number. Inputs with the same score may still have different conditional chances of error. Under covariate shift, reweighting those inputs can change coverage without changing the observed score summary.\n\nThe sharp range requires source confidence information, observed target confidence frequencies, the covariate-shift structure and an assumed bound on the covariate density ratio. Under those constraints, I characterize the best and worst coverage still compatible with the evidence. Sharp means that admissible laws attain the endpoints; it does not mean that data alone supply all the assumptions.\n\nThe structural refinement explains when this ambiguity disappears: conditional errors must have no hidden variation within confidence levels, apart from degenerate weight constraints. Source calibration by itself is not enough. The range makes the unresolved uncertainty visible instead of hiding it behind a single coverage estimate.", "seconds": 110, "backup": false}, {"title": "A limited audit can test a reassuring record", "note": "My related ICLR paper asks what additional labels can establish. Imagine a fixed cohort whose outcomes already exist in an archive, but some labels have been withheld from the evaluator. The partial record is committed before an audit. A model may look reassuring because its difficult cases are still unlabeled.\n\nWith a limited budget, the evaluator privately requests some of those existing labels and tests whether risk is excessive while controlling false alarms. Finding one error is not by itself proof of excessive risk. The paper characterizes the exact fixed-query asymptotic minimax detection frontier over adaptive policies and gives an attaining rule for truthful queries, under its stated risk and audit protocols.\n\nThis is not a result about recovering nonexistent loan counterfactuals or optimally splitting a budget across groups. It asks what a fixed audit budget can establish, and what remains unresolved when label quality is uncertain.", "seconds": 95, "backup": false}, {"title": "Turn a failure into a precise, testable question", "note": "The way I contribute to a research group is by connecting empirical failure patterns to precise statistical models, and then building checks that test those models' limits. In the UAI project, I started from an observed failure pattern; in my thesis, I turned that into counterexamples, a sufficient statistic, and sharp bounds, validated through simulations and controlled replay on UCI datasets.\n\nMy engineering background helps me build reproducible pipelines and keep experimental assumptions separate from deployment claims. What I want to strengthen during a PhD is deeper theoretical formulation through close collaboration—especially in robust conformal procedures and the design of useful uncertainty sets.", "seconds": 45, "backup": false}];const slides=[...document.querySelectorAll('.slide')];let idx=0,started=null,paused=0;const main=data.filter(s=>!s.backup).length;const target=data.reduce((a,s)=>a+s.seconds,0);const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
function time(){const elapsed=started===null?paused:paused+(Date.now()-started)/1000;document.getElementById('timing').textContent=(idx+1)+'/'+slides.length+' · '+(data[idx].backup?'Backup':fmt(data[idx].seconds)+' slide')+' · '+fmt(elapsed)+' / '+fmt(target)}
function show(n){idx=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===idx));document.getElementById('noteheading').textContent=(data[idx].backup?'Backup':fmt(data[idx].seconds))+' · '+data[idx].title.replaceAll('\n',' ');document.getElementById('notetext').textContent=data[idx].note;document.getElementById('progress').style.width=100*Math.min(idx+1,main)/main+'%';time()}
function timer(){if(started===null){started=Date.now()}else{paused+=(Date.now()-started)/1000;started=null}time()}function fullscreen(){if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('toggleNotes').onclick=()=>document.body.classList.toggle('notes');document.getElementById('full').onclick=fullscreen;document.getElementById('timer').onclick=timer;document.getElementById('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(idx+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(main-1);if(e.key.toLowerCase()==='n')document.body.classList.toggle('notes');if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='p')window.print();if(e.key.toLowerCase()==='t')timer();if(e.key.toLowerCase()==='r'){started=null;paused=0;time()}});document.addEventListener('click',e=>{if(e.target.closest('.controls')||e.target.closest('#notes'))return;show(idx+(e.clientX>window.innerWidth/2?1:-1))});setInterval(time,250);show(0);
</script></body></html>
