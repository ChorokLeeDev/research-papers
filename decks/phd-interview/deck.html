stops being reliable?</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">CHOROK LEE · KAIST · PHD INTERVIEWS</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">Can we tell when a model</tspan><tspan x="86" y="214.62">stops being reliable?</tspan></text><text fill="#c3c2b7" font-size="36" font-weight="400" text-anchor="start"><tspan x="86" y="316.76">We observe predictions.</tspan><tspan x="86" y="362.84">We need evidence about their reliability.</tspan></text><ellipse cx="926.0" cy="379.0" rx="65.0" ry="65.0" fill="#0d0d0d" stroke="#72adf5" stroke-width="3"/><text fill="#72adf5" font-size="30" font-weight="700" text-anchor="middle"><tspan x="926.0" y="388.3">X</tspan></text><line x1="1009" y1="379" x2="1091" y2="379" stroke="#c3c2b7" stroke-width="3"/><polygon points="1091,379 1075.767107542066,386.5471178184138 1075.767107542066,371.4528821815862" fill="#c3c2b7"/><ellipse cx="1183.0" cy="379.0" rx="78.0" ry="78.0" fill="#0d0d0d" stroke="#a69cf4" stroke-width="3"/><text fill="#a69cf4" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1183.0" y="388.3">score</tspan></text><line x1="1272" y1="379" x2="1360" y2="379" stroke="#c3c2b7" stroke-width="3"/><polygon points="1360,379 1344.767107542066,386.5471178184138 1344.767107542066,371.4528821815862" fill="#c3c2b7"/><ellipse cx="1433.0" cy="379.0" rx="62.0" ry="62.0" fill="#0d0d0d" stroke="#f3a277" stroke-width="3"/><text fill="#f3a277" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1433.0" y="388.3">?</tspan></text><text fill="#72adf5" font-size="27" font-weight="400" text-anchor="middle"><tspan x="929.0" y="504.57">Inputs</tspan></text><text fill="#a69cf4" font-size="27" font-weight="400" text-anchor="middle"><tspan x="1184.0" y="504.57">Model output</tspan></text><text fill="#f3a277" font-size="27" font-weight="400" text-ancho 'use strict';const data=[{"title": "Can we tell when a model\nstops being reliable?", "note": "Thank you for the opportunity to speak with you. I am Chorok Lee, a master’s student in Software Engineering at KAIST. My research asks what our available evidence can tell us about predictive reliability. I will briefly introduce my background, then explain how a study of conformal coverage failures led to my thesis and related work on missing labels. I will finish with the direction I would like to pursue during a PhD.", "seconds": 40, "backup": false, "cue": "What can the evidence tell us about reliability?"}, {"title": "From economics to building and evaluating ML", "note": "My undergraduate degree is in Economics from Yonsei University’s Underwood International College, and I spent an exchange year at Dartmouth. I worked as a software engineer before starting my master’s at KAIST in February 2025, supervised by Professor Insik Shin. I expect to graduate in February 2027. My preparation includes probability, statistics, stochastic calculus, Bayesian machine learning and deep learning. At SAP Labs Korea, I have worked on retrieval evaluation, agent workflows and cloud telemetry; before SAP, I built data pipelines and GraphRAG components at a legal AI startup. These experiences make implementation and measurement a natural part of my research. During a PhD, I want to deepen the statistical foundations behind those measurements.", "seconds": 70, "backup": false, "cue": "My engineering experience shapes how I investigate research questions."}, {"title": "Does the set contain the right answer?", "note": "When a single answer is uncertain, a model can return a set of possible labels. Coverage is how often that set contains the true label. Miscoverage is how often it misses, so it equals one minus coverage. Conformal prediction promises a minimum coverage on average when calibration and future cases are statistically interchangeable. After deployment, the inputs can change and the true labels may be unavailable. We can still see model scores and input changes, but those alone need not tell us whether the set still contains the right answer. My work asks what evidence is enough to check that particular promise.", "seconds": 65, "backup": false, "cue": "Coverage asks whether the set includes the true answer."}, {"title": "Diagnose → understand limits → ask for evidence", "note": "There are three stages in this research trajectory. My published UAI 2026 paper asks whether a model’s reliance on one feature helps explain coverage loss under shift. My master’s thesis, submitted to AISTATS 2027, asks what shift and confidence summaries can actually tell us about coverage. My related ICLR 2027 submission asks how much we can learn by checking a limited number of missing labels. The latter two papers are under review. Together, they move from observing failures to understanding what our summaries leave unresolved, then to asking for information that can help.", "seconds": 45, "backup": false, "cue": "Three projects ask what our evidence can establish."}, {"title": "A shift can hit what a model relies on", "note": "The starting point was a COVID-19 supply-chain case study. For each task, a LightGBM classifier takes a feature row and produces class probabilities; APS turns those probabilities into a label set. I used SHAP to measure how strongly the fitted model uses its top feature, as measured by SHAP. The question was whether a change affecting that feature could help explain coverage loss. The published sixteen-task summaries reported a positive association, but later checks with a different pipeline did not reproduce this pattern, so this remains exploratory. A simplified model gives a conditional bound when its dominant component stops supporting the true label. That raised the next question: what information do shift summaries leave out?", "seconds": 90, "backup": false, "cue": "A useful feature can become a vulnerability if its predictive relationship changes."}, {"title": "Same distance. Different direction. Different coverage.", "note": "I first use a fixed linear model with two labels, 0 and 1. It turns a feature vector into one numerical score. I assume a known logistic formula also gives the actual chance of label 1. Imagine the model uses only the first of two coordinates. Moving the inputs along that coordinate changes its scores; moving them sideways along the second does not. I construct two Gaussian shifts with the same distance but these different directions. Distance summaries that ignore the direction give the same value, while coverage can differ. Under the known label rule, keeping the distribution of score magnitudes is enough to determine coverage for every choice of set threshold.", "seconds": 110, "backup": false, "cue": "Direction belongs to the input shift; the model score is one number."}, {"title": "The same score can hide different chances of error", "note": "Next, I remove that assumption: we no longer know how the score connects to the true label. We assume the label rule for each full input stays the same, while the mix of inputs changes. Many features are squeezed into one score, so different inputs can get the same score while their sets have different chances of missing the answer. Using source labels, target scores and a limit on how much input types can become more common, I work out the lowest and highest possible coverage. These bounds are sharp: permitted cases reach each end. The range shows whether the evidence is enough to support the promised coverage.", "seconds": 110, "backup": false, "cue": "The same score can hide different chances that the set misses the answer."}, {"title": "A limited audit can test a reassuring record", "note": "My related ICLR paper takes the next step: asking for missing answers. Imagine a model has already made a thousand predictions, but five hundred existing outcomes are withheld. We keep the model fixed. After the partial record is committed, we privately sample pending cases and check their answers. We raise an alarm only when the error evidence passes a rule designed to limit false alarms. In one specified truthful-label experiment, distinguishing 10% from 20% error at a 5% false-alarm level needs a minimum budget of 57 queries for at least 95% detection. More generally, I prove the best worst-case detection limit for a fixed query budget as the cohort grows, and give a rule that reaches it.", "seconds": 95, "backup": false, "cue": "The question is how many existing answers we need to check."}, {"title": "Turn a failure into a precise, testable question", "note": "The way I contribute is by connecting empirical failure patterns to precise statistical questions, then building checks that test their limits. In my thesis, that meant counterexamples, coverage bounds, simulations and controlled replay on real-world benchmark datasets. My engineering background helps me build reproducible pipelines and keep experimental assumptions clear. During a PhD, I want to strengthen the theoretical formulation through close collaboration, while developing methods and experiments that make reliability claims useful. Thank you, and I would be happy to discuss the model setups, the results or possible first projects.", "seconds": 45, "backup": false, "cue": "I connect a research question to an implementation and a test."}];const slides=[...document.querySelectorAll('.slide')];let idx=0,started=null,paused=0;const main=data.filter(s=>!s.backup).length;const target=data.reduce((a,s)=>a+s.seconds,0);const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
function time(){const elapsed=started===null?paused:paused+(Date.now()-started)/1000;document.getElementById('timing').textContent=(idx+1)+'/'+slides.length+' · '+(data[idx].backup?'Backup':fmt(data[idx].seconds)+' slide')+' · '+fmt(elapsed)+' / '+fmt(target)}
function show(n){idx=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===idx));document.getElementById('noteheading').textContent=(data[idx].backup?'Backup':fmt(data[idx].seconds))+' · '+data[idx].title.replaceAll('\n',' ');document.getElementById('notetext').textContent=data[idx].note;document.getElementById('resumecue').textContent='Back to point: '+data[idx].cue;document.getElementById('notes').scrollTop=0;document.getElementById('progress').style.width=100*Math.min(idx+1,main)/main+'%';time()}
function timer(){if(started===null){started=Date.now()}else{paused+=(Date.now()-started)/1000;started=null}time()}function fullscreen(){if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('toggleNotes').onclick=()=>document.body.classList.toggle('notes');document.getElementById('full').onclick=fullscreen;document.getElementById('timer').onclick=timer;document.getElementById('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)){show(Number(e.key)-1);return}if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(idx+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(main-1);if(e.key.toLowerCase()==='n')document.body.classList.toggle('notes');if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='p')window.print();if(e.key.toLowerCase()==='t')timer();if(e.key.toLowerCase()==='r'){started=null;paused=0;time()}});document.addEventListener('click',e=>{if(e.target.closest('.controls')||e.target.closest('#notes'))return;show(idx+(e.clientX>window.innerWidth/2?1:-1))});setInterval(time,250);show(0);
</script></body></html>
