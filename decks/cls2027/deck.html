</style></head><body><section class="slide active" aria-label="Slide 1"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-0"><title id="title-0">Chorok Lee</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">MAX PLANCK ETH CENTER FOR LEARNING SYSTEMS · 2027</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">Chorok Lee</tspan></text><text fill="#f0efec" font-size="45" font-weight="700" text-anchor="start"><tspan x="86" y="276.95">What can our evidence establish about predictive reliability?</tspan></text><rect x="86" y="389" width="687" height="237" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="86" y="409" width="4" height="197" rx="0" fill="#a69cf4" stroke="#a69cf4" stroke-width="1.5"/><text fill="#a69cf4" font-size="31" font-weight="700" text-anchor="start"><tspan x="114" y="444.21">KAIST · 2025–present</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="114" y="500.07">M.S. in Software Engineering</tspan><tspan x="114" y="537.1899999999999">Advisor: Prof. Insik Shin</tspan><tspan x="114" y="574.31">Completion expected February 2027</tspan></text><rect x="827" y="389" width="687" height="237" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="827" y="409" width="4" height="197" rx="0" fill="#72adf5" stroke="#72adf5" stroke-width="1.5"/><text fill="#72adf5" font-size="31" font-weight="700" text-anchor="start"><tspan x="855" y="444.21">Yonsei University · 2014–2021</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="855" y="500.07">B.A. in Economics</tspan><tspan x="855" y="537.1899999999999">Underwood International College</tspan><tspan x="855" y="574.31">Dartmouth exchange · 2015–2016</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="86" y="730.39">Distribution shift / Coverage identification / Selective labels</tspan></text><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">Applicant 13470 · Chorok Lee · choroklee@kaist.ac.kr</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">01 / 05</tspan></text></svg></section><section class="slide" aria-label="Slide 2"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-1"><title id="title-1">The starting point: coverage fails differently</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">PUBLISHED RESEARCH · UAI 2026</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">The starting point: coverage fails differently</tspan></text><rect x="86" y="275" width="687" height="248" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="86" y="295" width="4" height="208" rx="0" fill="#f3a277" stroke="#f3a277" stroke-width="1.5"/><text fill="#f3a277" font-size="34" font-weight="700" text-anchor="start"><tspan x="114" y="332.94">Observed failure</tspan></text><text fill="#c3c2b7" font-size="32" font-weight="400" text-anchor="start"><tspan x="114" y="392.64">Similar temporal disruption.</tspan><tspan x="114" y="433.59999999999997">Different conformal coverage losses.</tspan></text><rect x="827" y="275" width="687" height="248" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="827" y="295" width="4" height="208" rx="0" fill="#72adf5" stroke="#72adf5" stroke-width="1.5"/><text fill="#72adf5" font-size="34" font-weight="700" text-anchor="start"><tspan x="855" y="332.94">A diagnostic—and its limit</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="855" y="389.90999999999997">Feature-importance concentration</tspan><tspan x="855" y="427.03">helps in studied boosted models.</tspan><tspan x="855" y="464.15">It is not a universal predictor.</tspan></text><line x1="787" y1="397" x2="814" y2="397" stroke="#c3c2b7" stroke-width="3"/><polygon points="814,397 798.767107542066,404.5471178184138 798.767107542066,389.4528821815862" fill="#c3c2b7"/><rect x="86" y="588" width="1428" height="160" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><text fill="#f0efec" font-size="37" font-weight="700" text-anchor="start"><tspan x="119" y="665.67">From diagnosing failure to asking what the evidence identifies.</tspan></text><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">Lee, UAI 2026 · PMLR 337:3453–3476 · published · diagram is conceptual</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">02 / 05</tspan></text></svg></section><section class="slide" aria-label="Slide 3"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-2"><title id="title-2">Thesis: identify a range instead of assuming a point</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">MASTER’S THESIS · SUBMITTED TO AISTATS 2027</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">Thesis: identify a range instead of assuming a point</tspan></text><rect x="86" y="269" width="687" height="239" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="86" y="289" width="4" height="199" rx="0" fill="#f3a277" stroke="#f3a277" stroke-width="1.5"/><text fill="#f3a277" font-size="32" font-weight="700" text-anchor="start"><tspan x="114" y="325.12">Information can be lost</tspan></text><text fill="#c3c2b7" font-size="30" font-weight="400" text-anchor="start"><tspan x="114" y="382.26">Equal shift magnitudes</tspan><tspan x="114" y="420.65999999999997">do not determine coverage.</tspan><tspan x="114" y="459.06">The score–label link matters.</tspan></text><rect x="827" y="269" width="687" height="239" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="827" y="289" width="4" height="199" rx="0" fill="#a69cf4" stroke="#a69cf4" stroke-width="1.5"/><text fill="#a69cf4" font-size="32" font-weight="700" text-anchor="start"><tspan x="855" y="325.12">Retain unresolved uncertainty</tspan></text><text fill="#c3c2b7" font-size="28" font-weight="400" text-anchor="start"><tspan x="855" y="380.44">Source calibration + target confidence</tspan><tspan x="855" y="416.28">+ a covariate density-ratio bound</tspan><tspan x="855" y="452.12">→ a sharp coverage envelope.</tspan></text><line x1="177" y1="635" x2="1416" y2="635" stroke="#383835" stroke-width="3"/><rect x="395" y="612" width="782" height="47" rx="6" fill="#39314f" stroke="#a69cf4" stroke-width="2"/><line x1="395" y1="592" x2="395" y2="678" stroke="#72adf5" stroke-width="4"/><line x1="1177" y1="592" x2="1177" y2="678" stroke="#f3a277" stroke-width="4"/><text fill="#f0efec" font-size="29" font-weight="700" text-anchor="middle"><tspan x="776.0" y="646.39">Attainable coverage range</tspan></text><text fill="#c3c2b7" font-size="27" font-weight="400" text-anchor="start"><tspan x="86" y="748.57">The density-ratio constraint is assumed; source calibration alone is insufficient.</tspan></text><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">AISTATS 2027: submitted, decision pending · source: thesis abstract · envelope is schematic</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">03 / 05</tspan></text></svg></section><section class="slide" aria-label="Slide 4"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-3"><title id="title-3">Related work: how much can more labels establish?</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">SUBMITTED TO ICLR 2027 · SELECTIVE AND NOISY LABELS</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">Related work: how much can more labels establish?</tspan></text><rect x="86" y="287" width="449" height="298" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="86" y="307" width="4" height="258" rx="0" fill="#72adf5" stroke="#72adf5" stroke-width="1.5"/><text fill="#72adf5" font-size="31" font-weight="700" text-anchor="start"><tspan x="114" y="342.21">Observed evidence</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="114" y="398.07">Selective labels can hide</tspan><tspan x="114" y="435.19">errors behind good</tspan><tspan x="114" y="472.31">observed accuracy.</tspan></text><rect x="575" y="287" width="449" height="298" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="575" y="307" width="4" height="258" rx="0" fill="#a69cf4" stroke="#a69cf4" stroke-width="1.5"/><text fill="#a69cf4" font-size="31" font-weight="700" text-anchor="start"><tspan x="603" y="342.21">Additional audit</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="603" y="398.07">Private queries of</tspan><tspan x="603" y="435.19">existing outcomes;</tspan><tspan x="603" y="472.31">false-alarm control.</tspan></text><rect x="1064" y="287" width="449" height="298" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="1064" y="307" width="4" height="258" rx="0" fill="#73cdb0" stroke="#73cdb0" stroke-width="1.5"/><text fill="#73cdb0" font-size="31" font-weight="700" text-anchor="start"><tspan x="1092" y="342.21">What the budget buys</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="1092" y="398.07">Detection power depends</tspan><tspan x="1092" y="435.19">on query count, label quality</tspan><tspan x="1092" y="472.31">and cohort size.</tspan></text><text fill="#f0efec" font-size="35" font-weight="700" text-anchor="start"><tspan x="86" y="717.85">More labels and better information about labels are different resources.</tspan></text><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">ICLR 2027: submitted, decision pending · frozen-cohort audit with stated risk and label protocols</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">04 / 05</tspan></text></svg></section><section class="slide" aria-label="Slide 5"><svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-4"><title id="title-4">At CLS: two projects in reliable evaluation</title><rect width="1600" height="900" fill="#0d0d0d"/><text fill="#a69cf4" font-size="21" font-weight="700" text-anchor="start"><tspan x="86" y="68.11">PROPOSED PHD DIRECTION · FROM MY MOTIVATION LETTER</tspan></text><text fill="#f0efec" font-size="54" font-weight="700" text-anchor="start"><tspan x="86" y="154.14">At CLS: two projects in reliable evaluation</tspan></text><rect x="86" y="275" width="687" height="310" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="86" y="295" width="4" height="270" rx="0" fill="#a69cf4" stroke="#a69cf4" stroke-width="1.5"/><text fill="#a69cf4" font-size="31" font-weight="700" text-anchor="start"><tspan x="114" y="330.21">1 · Calibration under shift</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="114" y="386.07">Partially identify the confidence law</tspan><tspan x="114" y="423.19">itself from evidence;</tspan><tspan x="114" y="460.31">then characterize risk under shift.</tspan></text><rect x="827" y="275" width="687" height="310" rx="16" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/><rect x="827" y="295" width="4" height="270" rx="0" fill="#73cdb0" stroke="#73cdb0" stroke-width="1.5"/><text fill="#73cdb0" font-size="31" font-weight="700" text-anchor="start"><tspan x="855" y="330.21">2 · Label-budget lower bounds</tspan></text><text fill="#c3c2b7" font-size="29" font-weight="400" text-anchor="start"><tspan x="855" y="386.07">Certify deployed risk</tspan><tspan x="855" y="423.19">under selective observation;</tspan><tspan x="855" y="460.31">identify which label budgets suffice.</tspan></text><text fill="#a69cf4" font-size="24" font-weight="400" text-anchor="start"><tspan x="114" y="550.84">Proposed interest: Celestine Mendler-Dünner</tspan></text><text fill="#73cdb0" font-size="24" font-weight="400" text-anchor="start"><tspan x="855" y="550.84">Proposed interest: Moritz Hardt</tspan></text><text fill="#f0efec" font-size="35" font-weight="700" text-anchor="start"><tspan x="86" y="686.85">Why CLS: develop one problem through theory and measurement.</tspan></text><text fill="#c3c2b7" font-size="27" font-weight="400" text-anchor="start"><tspan x="86" y="740.57">Joint ETH–Tübingen environment · sustained collaboration and exchange</tspan></text><line x1="86" y1="818" x2="1514" y2="818" stroke="#383835" stroke-width="1"/><text fill="#96938c" font-size="17" font-weight="400" text-anchor="start"><tspan x="86" y="854.47">Proposed projects and advisor interests · source: submitted CLS motivation letter</tspan></text><text fill="#96938c" font-size="20" font-weight="700" text-anchor="end"><tspan x="1514" y="855.2">05 / 05</tspan></text></svg></section><asid 'use strict';const data=[{"title": "Chorok Lee", "note": "Hello, I am Chorok Lee, a master's student in Software Engineering at KAIST, supervised by Professor Insik Shin. I expect to complete my degree in February 2027. I previously studied Economics at Yonsei University, with an exchange year at Dartmouth. My research asks what observable evidence can establish about predictive reliability, and which additional observations make evaluation informative. I study these questions under distribution shift and selective or noisy labels.", "seconds": 40, "backup": false}, {"title": "The starting point: coverage fails differently", "note": "My published UAI 2026 paper began with a COVID-19 case study: classification tasks facing the same temporal disruption lost conformal coverage by very different amounts. I studied SHAP concentration, the share of feature importance assigned to the top feature, as an exploratory vulnerability diagnostic. In the gradient-boosted models studied, concentration was associated with greater coverage loss. The diagnostic has model-dependent limits. This led me to a deeper question: which reliability conclusions can the summaries we observe actually determine?", "seconds": 35, "backup": false}, {"title": "Thesis: identify a range instead of assuming a point", "note": "My master's thesis, submitted to AISTATS 2027 and currently under review, formalizes that question. First, in a binary setting with a known logistic label law, shifts can have equal rotation-invariant magnitudes but different conformal coverage. A more accurate estimate of the same magnitude cannot recover information it discarded. Under that known link, the absolute-score distribution does determine the full coverage curve.\n\nSecond, I remove the known-link assumption. Given source confidence calibration, target confidence frequencies, and an assumed covariate density-ratio bound, I derive a sharp partial-identification envelope: the range of coverage compatible with those inputs. The endpoints are attainable. This distinguishes uncertainty caused by a limited sample from ambiguity that the observed summaries cannot resolve. For a PhD, I want to extend this perspective to risk scores whose calibration is itself uncertain.", "seconds": 60, "backup": false}, {"title": "Related work: how much can more labels establish?", "note": "My related ICLR 2027 submission studies evaluation when difficult cases can be missing their labels. For a frozen predictor and cohort with a committed partial record, I ask how well an additional audit can detect excessive risk while controlling false alarms. The paper characterizes an exact fixed-query asymptotic minimax detection frontier and an attaining rule for truthful queries.\n\nWith uncertain audit-label reliability, more requests need not resolve the ambiguity. Query count, knowledge of label quality, and cohort size are different resources. These results depend on specified risk and audit protocols. The broader question is how to acquire evidence that makes a reliability claim informative.", "seconds": 50, "backup": false}, {"title": "At CLS: two projects in reliable evaluation", "note": "At CLS, I would like to pursue two projects from my motivation letter. First, partial identification of risk-score calibration under shift: characterize the confidence law itself as a set of possibilities supported by evidence. Second, label-budget lower bounds for certifying a deployed model's risk under selective observation. I would be excited to connect these questions to Celestine Mendler-Dünner's work on risk scores and Moritz Hardt's work on evaluation limits. The joint ETH and Tübingen environment, including the twelve-month exchange, would let me develop one problem through theory and empirical evaluation, with sustained collaboration across groups. Thank you.", "seconds": 55, "backup": false}];const slides=[...document.querySelectorAll('.slide')];let idx=0,started=null,paused=0;const main=data.filter(s=>!s.backup).length;const target=data.reduce((a,s)=>a+s.seconds,0);const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
function time(){const elapsed=started===null?paused:paused+(Date.now()-started)/1000;document.getElementById('timing').textContent=(idx+1)+'/'+slides.length+' · '+(data[idx].backup?'Backup':fmt(data[idx].seconds)+' slide')+' · '+fmt(elapsed)+' / '+fmt(target)}
function show(n){idx=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===idx));document.getElementById('noteheading').textContent=(data[idx].backup?'Backup':fmt(data[idx].seconds))+' · '+data[idx].title.replaceAll('\n',' ');document.getElementById('notetext').textContent=data[idx].note;document.getElementById('progress').style.width=100*Math.min(idx+1,main)/main+'%';time()}
function timer(){if(started===null){started=Date.now()}else{paused+=(Date.now()-started)/1000;started=null}time()}function fullscreen(){if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('toggleNotes').onclick=()=>document.body.classList.toggle('notes');document.getElementById('full').onclick=fullscreen;document.getElementById('timer').onclick=timer;document.getElementById('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(idx+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(main-1);if(e.key.toLowerCase()==='n')document.body.classList.toggle('notes');if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='p')window.print();if(e.key.toLowerCase()==='t')timer();if(e.key.toLowerCase()==='r'){started=null;paused=0;time()}});document.addEventListener('click',e=>{if(e.target.closest('.controls')||e.target.closest('#notes'))return;show(idx+(e.clientX>window.innerWidth/2?1:-1))});setInterval(time,250);show(0);
</script></body></html>
